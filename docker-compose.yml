# Shield - Docker Compose for Development and Testing
version: '3.8'

services:
  # Full test suite
  test:
    build: .
    volumes:
      - .:/shield
    command: >
      bash -c "
        echo '=== Running Shield Test Suite ===' &&
        cd /shield/shield-core && cargo test --features async &&
        cd /shield/python && python3 -m pytest &&
        cd /shield/javascript && npm test &&
        cd /shield/go && go test ./... &&
        echo '=== All tests passed! ==='
      "
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"

  # Rust development
  rust:
    build: .
    volumes:
      - .:/shield
      - cargo-cache:/root/.cargo/registry
    working_dir: /shield/shield-core
    command: cargo watch -x "test --features async"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"

  # Python development
  python:
    image: python:3.11-slim
    volumes:
      - ./python:/app
    working_dir: /app
    command: >
      bash -c "
        pip install -e '.[dev]' &&
        python -m pytest --watch
      "
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"

  # JavaScript development
  javascript:
    image: node:20-slim
    volumes:
      - ./javascript:/app
    working_dir: /app
    command: npm run test:watch
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"

  # Interoperability tests
  interop:
    build: .
    volumes:
      - .:/shield
    working_dir: /shield/tests
    command: python3 run_interop_tests.py
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"

  # Example: FastAPI server with Shield
  fastapi-example:
    image: python:3.11-slim
    volumes:
      - ./python:/app/shield
      - ./examples:/app/examples
    working_dir: /app
    ports:
      - "8000:8000"
    command: >
      bash -c "
        pip install fastapi uvicorn &&
        cd /app/shield && pip install -e . &&
        cd /app/examples/fastapi &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cargo-cache:
