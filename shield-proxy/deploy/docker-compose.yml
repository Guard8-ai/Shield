version: "3.8"

services:
  shield-proxy-active:
    build:
      context: ../..
      dockerfile: shield-proxy/Dockerfile
    ports:
      - "8443:8443"
      - "5353:5353/udp"
    volumes:
      - ./shield-proxy.toml:/etc/shield-proxy/config.toml:ro
    environment:
      RUST_LOG: info
    restart: on-failure
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/usr/local/bin/shield-proxy", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  shield-proxy-standby:
    build:
      context: ../..
      dockerfile: shield-proxy/Dockerfile
    volumes:
      - ./shield-proxy-standby.toml:/etc/shield-proxy/config.toml:ro
    environment:
      RUST_LOG: info
    restart: on-failure
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/usr/local/bin/shield-proxy", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
